<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinanceLab · 金融学习工具</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b1220; --panel:#121b2e; --panel2:#182338; --line:#24344f;
    --text:#e6edf7; --muted:#8b9cb6; --accent:#34d399; --accent2:#38bdf8;
    --danger:#f87171; --warn:#fbbf24;
  }
  body{
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%,#152a45 0%,var(--bg) 55%);
    color:var(--text);min-height:100vh;
  }
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  /* ---------- 侧栏 ---------- */
  .sidebar{
    background:rgba(18,27,46,.75);backdrop-filter:blur(8px);
    border-right:1px solid var(--line);padding:22px 14px;
    display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
  }
  .logo{font-size:17px;font-weight:700;letter-spacing:.5px;padding:0 8px 18px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .nav-btn{
    display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;
    background:transparent;border:1px solid transparent;color:var(--muted);
    font-size:14px;cursor:pointer;transition:.18s;font-family:inherit;
  }
  .nav-btn:hover{background:var(--panel2);color:var(--text)}
  .nav-btn.active{background:linear-gradient(90deg,rgba(52,211,153,.16),rgba(56,189,248,.10));
    color:var(--text);border-color:rgba(52,211,153,.35)}
  .side-foot{margin-top:auto;font-size:11px;color:#5c6d88;padding:12px 8px;line-height:1.6}
  /* ---------- 主区 ---------- */
  main{padding:28px 34px 60px;max-width:1080px;width:100%}
  h1{font-size:24px;margin-bottom:6px}
  h2{font-size:17px;margin:26px 0 12px}
  .sub{color:var(--muted);font-size:13.5px;line-height:1.7}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
  /* 概览 */
  .hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .ring{
    width:112px;height:112px;border-radius:50%;flex:none;
    display:grid;place-items:center;position:relative;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), #1d2b44 0);
  }
  .ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
  .ring span{position:relative;z-index:1;font-size:22px;font-weight:700}
  .stat{font-size:26px;font-weight:700;color:var(--accent)}
  .stat.blue{color:var(--accent2)}
  .stat-label{font-size:12.5px;color:var(--muted);margin-top:2px}
  /* 课程列表 */
  .course{
    text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;cursor:pointer;transition:.18s;font-family:inherit;color:var(--text);width:100%;
  }
  .course:hover{transform:translateY(-2px);border-color:#33507a;background:var(--panel2)}
  .course .tag{font-size:11px;color:var(--accent);border:1px solid rgba(52,211,153,.35);
    padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:9px}
  .course .tag.done{color:var(--accent2);border-color:rgba(56,189,248,.4)}
  .course h3{font-size:15px;margin-bottom:6px}
  .course p{font-size:12.5px;color:var(--muted);line-height:1.65}
  .course .meta{font-size:11.5px;color:#5c6d88;margin-top:10px}
  /* 课程详情 */
  .back{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:13.5px;
    margin-bottom:16px;font-family:inherit;padding:0}
  .back:hover{text-decoration:underline}
  .article p{font-size:14.5px;line-height:1.95;color:#c8d5e8;margin-bottom:14px}
  .points{list-style:none;margin:6px 0 20px}
  .points li{font-size:13.5px;line-height:1.8;color:#b9c8de;padding-left:20px;position:relative;margin-bottom:7px}
  .points li::before{content:"▸";position:absolute;left:0;color:var(--accent)}
  /* 按钮 */
  .btn{
    background:linear-gradient(135deg,var(--accent),#22a58a);color:#04180f;border:none;
    padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:.18s;
  }
  .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--accent2);border:1px solid #2c4a70;font-weight:500}
  .btn.ghost:hover{background:rgba(56,189,248,.08)}
  /* 测验 */
  .quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .bar{height:6px;background:#1d2b44;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .3s;border-radius:99px}
  .q-text{font-size:16px;line-height:1.7;margin-bottom:18px;font-weight:500}
  .opt{
    display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;
    background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    color:#ccd9ec;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s;line-height:1.6;
  }
  .opt:hover:not(.locked){border-color:#3d5c86;background:#1c2a42}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--accent);background:rgba(52,211,153,.13);color:#c9ffe9}
  .opt.wrong{border-color:var(--danger);background:rgba(248,113,113,.12);color:#ffd6d6}
  .explain{margin-top:14px;padding:14px 16px;border-left:3px solid var(--accent2);
    background:rgba(56,189,248,.07);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.8;color:#b9cde4}
  .explain b{color:var(--accent2)}
  /* 计算器 */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:9px 16px;border-radius:99px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
  .tab:hover{color:var(--text)}
  .tab.active{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45);color:var(--accent)}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .field input{
    width:100%;padding:11px 13px;background:#0d1729;border:1px solid var(--line);
    border-radius:9px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.15s;
  }
  .field input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
  .result{background:linear-gradient(135deg,rgba(52,211,153,.09),rgba(56,189,248,.07));
    border:1px solid rgba(52,211,153,.28);border-radius:13px;padding:20px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
  .result .k{font-size:12px;color:var(--muted);margin-bottom:6px}
  .result .v{font-size:21px;font-weight:700;color:var(--accent);word-break:break-all}
  .result .v.b{color:var(--accent2)}
  .note{font-size:12px;color:#5c6d88;margin-top:14px;line-height:1.7}
  /* 移动端 */
  @media(max-width:760px){
    .app{grid-template-columns:1fr}
    .sidebar{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;
      padding:10px 12px;gap:6px;z-index:20;border-right:none;border-bottom:1px solid var(--line)}
    .logo{display:none}
    .nav-btn{white-space:nowrap;width:auto;padding:9px 14px;font-size:13px}
    .side-foot{display:none}
    main{padding:20px 16px 50px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">💰 FinanceLab</div>
    <button class="nav-btn active" data-view="dash">📊 学习概览</button>
    <button class="nav-btn" data-view="courses">📚 知识库</button>
    <button class="nav-btn" data-view="quiz">🧠 随堂测验</button>
    <button class="nav-btn" data-view="calc">🧮 金融计算器</button>
    <div class="side-foot">进度保存在本机浏览器<br>不涉及任何投资建议</div>
  </aside>
  <main><div id="view"></div></main>
</div>

<script>
/* =========================================================
   数据层：课程 + 题库
   ========================================================= */
const COURSES = [
{
  id:'tvm', cat:'基础', title:'货币时间价值', minutes:8,
  summary:'同样100元，今天的和一年后的并不等价——这是所有金融决策的起点。',
  points:[
    '终值 FV = PV × (1+r)^n；现值 PV = FV ÷ (1+r)^n',
    '折现率 = 无风险利率 + 通胀补偿 + 风险溢价',
    '折现率越高，未来同样一笔钱今天越不值钱'
  ],
  body:[
    '货币时间价值（Time Value of Money）是金融学的第一块基石。在理想世界里，今天拿到1元比明天拿到1元更好，因为今天的1元可以立刻投资生息。反过来说，未来的1元折回到今天，就要打一个折扣。',
    '这个"打折"用的利率叫折现率。它至少包含三部分：资金的无风险回报、通货膨胀造成的购买力损失补偿，以及承担不确定性所要求的风险溢价。',
    '这条公式决定了大量现实决策：房贷要不要提前还、保险的现金价值划不划算、一家公司值不值得收购——本质上都是在比较发生在不同时间点上的现金流。'
  ],
  quiz:[
    {q:'假设无风险利率为 5%，且不考虑通胀与税收，今天的 100 元与一年后的 105 元相比：',
     options:['今天的 100 元更值钱','一年后的 105 元更值钱','两者在经济上等价','无法比较'],
     a:2, why:'100 × (1+5%) = 105，两者在给定假设下现值相等，是等价的。'},
    {q:'其他条件不变，提高折现率会使未来现金流的现值：',
     options:['上升','下降','不变','先升后降'],
     a:1, why:'折现率在分母上，PV = FV ÷ (1+r)^n，r 越大现值越小。'}
  ]
},
{
  id:'compound', cat:'基础', title:'复利与 72 法则', minutes:7,
  summary:'复利是世界第八大奇迹，72 法则让你三秒心算翻倍时间。',
  points:[
    'FV = PV × (1+r)^n，利息本身也会产生利息',
    '72 法则：翻倍年数 ≈ 72 ÷ 年化收益率(%)',
    '时间比收益率更重要——早开始 10 年的优势极难追上'
  ],
  body:[
    '单利只对本金计息，复利则对本金加已产生的利息一起计息。短期看差别不大，长期看是指数级的分野：年化 8%，10 年约 2.16 倍，30 年约 10.06 倍，40 年约 21.7 倍。',
    '72 法则是一个心算工具：用 72 除以年化收益率，就得到本金翻倍大约需要的年数。年化 8% 约 9 年翻倍，年化 6% 约 12 年，年化 12% 约 6 年。',
    '复利的另一面是负债。信用卡循环利息年化常在 15% 以上，意味着欠款不到 5 年就翻一倍——所以高息负债要优先清偿，这等于一笔无风险的"投资回报"。'
  ],
  quiz:[
    {q:'按 72 法则，年化收益率 8% 时本金翻倍大约需要：',
     options:['约 6 年','约 9 年','约 12 年','约 18 年'],
     a:1, why:'72 ÷ 8 = 9 年。精确计算为 ln2 / ln1.08 ≈ 9.01 年。'},
    {q:'年化 10% 复利，10 年后 1 万元大约变成：',
     options:['2 万元','约 2.59 万元','10 万元','1.1 万元'],
     a:1, why:'1 × (1.1)^10 ≈ 2.594 万元。单利只有 2 万元，差额来自复利。'},
    {q:'关于复利，下列说法错误的是：',
     options:['利息也会继续产生利息','时间越长复利效应越显著','信用卡高息负债也应尽量拖延偿还','早开始投资比追求高收益率更可控'],
     a:2, why:'高息负债的复利对你不利，应优先偿还，相当于获得无风险高回报。'}
  ]
},
{
  id:'risk', cat:'基础', title:'风险与收益的关系', minutes:8,
  summary:'高收益不是免费的，它是对承担风险的补偿，而且只补偿"系统性风险"。',
  points:[
    '预期收益 = 无风险利率 + 风险溢价',
    '总风险 = 系统性风险（不可分散）+ 非系统性风险（可分散）',
    '市场只奖励系统性风险，非系统性风险不带来额外补偿'
  ],
  body:[
    '在有效市场里，不存在"高收益低风险"的免费午餐。想要更高的预期回报，就必须接受更大的波动和亏损可能性。这是投资世界最基本的交换关系。',
    '风险分为两类。系统性风险来自整个市场：利率变化、经济衰退、战争与政策，无法通过分散持股消除，因此市场会为承担它支付溢价。非系统性风险来自单个公司：业绩暴雷、管理层丑闻、单一产品失败，这类风险可以通过分散投资大幅降低，所以市场不为它付费。',
    '一个常见的误区是把"过去涨得好"当成"风险低"。历史高收益往往伴随高波动，只是波动还没兑现成亏损而已。'
  ],
  quiz:[
    {q:'根据现代投资组合理论，市场会为以下哪种风险提供补偿？',
     options:['非系统性风险','系统性风险','所有风险','操作失误风险'],
     a:1, why:'非系统性风险可以通过分散消除，市场不为它付费；只有系统性风险获得风险溢价。'},
    {q:'某人说"这个产品保本还能年化 15%"，最合理的判断是：',
     options:['值得立刻买入','大概率存在未披露的风险或欺诈','这是复利的力量','应该加杠杆买入'],
     a:1, why:'收益与风险匹配是基本规律，高收益保本承诺通常意味着风险被隐藏或本身是骗局。'}
  ]
},
{
  id:'diversify', cat:'投资', title:'分散投资与相关性', minutes:7,
  summary:'分散的关键不是"买很多只"，而是买相关性低的资产。',
  points:[
    '组合波动取决于资产间的相关性，而非资产数量',
    '相关系数越低，分散效果越好（+1 完全同向，-1 完全反向）',
    '分散能降低波动，但不能消除系统性风险'
  ],
  body:[
    '把资金分成十份买入十只科技股，并不叫分散——它们会一起涨、一起跌。真正的分散需要资产之间"不同步"。',
    '相关系数是衡量两个资产走势同步程度的指标，范围从 -1 到 +1。相关系数越接近 -1，组合的波动下降得越明显。股票与债券、发达市场与新兴市场、本币资产与外币资产，通常呈现较低相关性。',
    '需要清醒认识到：分散只能降低非系统性风险，市场整体下跌时几乎所有风险资产会同时下跌。分散让你活得更久，但不能让你在市场崩盘时独善其身。'
  ],
  quiz:[
    {q:'分散投资降低组合风险，最关键的因素是：',
     options:['持有资产的数量足够多','资产之间的相关性足够低','每只资产都选行业龙头','买入后长期不看'],
     a:1, why:'数量不是关键。十只高相关股票的组合，波动几乎等于一只股票。'},
    {q:'当两个资产的相关系数为 -1 时，意味着：',
     options:['它们完全同向波动','它们完全反向波动','它们毫无关系','它们的收益必然为正'],
     a:1, why:'-1 表示完全负相关，是理论上分散效果最好的极端情况。'}
  ]
},
{
  id:'alloc', cat:'投资', title:'资产配置', minutes:8,
  summary:'决定你长期收益的，主要不是选股，而是股债比例。',
  points:[
    '资产配置贡献了组合波动的主要部分',
    '股票比例 ≈ 可承受的最大回撤 × 2（经验法则）',
    '再平衡：定期把偏离的配置比例拉回目标'
  ],
  body:[
    '资产配置指的是把资金分配到股票、债券、现金、商品、房产等大类资产上的比例。学术研究反复发现，组合的波动绝大部分由大类配置决定，而不是由具体选了哪只股票决定。',
    '一个简单的经验法则：你能承受的最大回撤乘以 2，大致对应可以配置的股票比例。如果你看到账户缩水 20% 就会失眠，那么股票仓位控制在 40% 左右更合适。',
    '再平衡是资产配置的执行环节。设定目标比例后，定期（比如每年一次）把涨多的卖掉、跌多的补上，恢复原比例。这个动作天然实现了"高抛低吸"，也控制了风险敞口的漂移。'
  ],
  quiz:[
    {q:'对长期投资组合波动影响最大的通常是：',
     options:['个股选择','股债等大类资产的配置比例','买入的具体时点','交易手续费'],
     a:1, why:'大类资产配置决定了组合的整体风险特征，选股的影响远小于它。'},
    {q:'如果投资者只能承受 20% 的最大回撤，按经验法则股票仓位宜约为：',
     options:['20%','40%','70%','90%'],
     a:1, why:'经验法则：股票比例 ≈ 最大可承受回撤 × 2，20% × 2 = 40%。'}
  ]
},
{
  id:'stock', cat:'投资', title:'股票基础', minutes:8,
  summary:'买股票就是买公司的一部分所有权，收益来自分红和盈利增长。',
  points:[
    '股东是剩余索取权人：分红在债权人之后',
    '长期收益 ≈ 股息率 + 盈利增长 + 估值变化',
    '短期股价由情绪和资金驱动，长期由盈利驱动'
  ],
  body:[
    '股票代表公司的部分所有权。作为股东，你在债权人之后获得剩余收益：公司经营好，你分享利润增长；公司破产，你排在最后受偿。',
    '持有股票的长期回报可以拆成三块：股息率、每股盈利的增长、以及估值（市盈率）的变化。前两项由企业基本面决定，是可持续的；第三项由市场情绪决定，长期看均值回归，不能无限寄望。',
    '这解释了一个现象：短期股价和公司业绩常常脱节，因为短期由资金与情绪主导；但把时间拉长到十年以上，股价与盈利的相关性会显著提升。'
  ],
  quiz:[

/* =========================================================
   状态与存储
   ========================================================= */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let progress = store.get('fl_progress', {learned:[], quizBest:0, quizCount:0});
let state = { view:'dash', courseId:null, quiz:null, calcTab:'compound' };
const $view = document.getElementById('view');

/* =========================================================
   工具函数
   ========================================================= */
const fmtMoney = n => '¥' + Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2});
const fmtNum   = n => Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2});
const pct = n => (n*100).toFixed(2) + '%';
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* =========================================================
   渲染：路由
   ========================================================= */
function render(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.view === state.view);
  });
  if(state.view==='dash')    $view.innerHTML = viewDash();
  if(state.view==='courses') $view.innerHTML = state.courseId ? viewCourse(state.courseId) : viewCourses();
  if(state.view==='quiz')    $view.innerHTML = viewQuiz();
  if(state.view==='calc')    $view.innerHTML = viewCalc();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- 概览 ---------- */
function viewDash(){
  const total = COURSES.length;
  const learned = progress.learned.length;
  const p = Math.round(learned/total*100);
  const next = COURSES.find(c=>!progress.learned.includes(c.id)) || COURSES[0];
  return `
    <h1>学习概览</h1>
    <p class="sub">系统化掌握金融底层逻辑 · 全部内容本地运行，无需联网</p>
    <div class="card" style="margin-top:22px">
      <div class="hero">
        <div class="ring" style="--p:${p}"><span>${p}%</span></div>
        <div style="flex:1;min-width:200px">
          <div style="font-size:15px;margin-bottom:6px">课程完成度</div>
          <p class="sub">已完成 <b style="color:var(--accent)">${learned}</b> / ${total} 个知识模块。
          ${p===100?'太棒了，你已经走完整个知识库！':'继续推进，别让复利在知识上也缺席。'}</p>
          <button class="btn" style="margin-top:16px" data-act="open-course" data-id="${next.id}">
            ${learned===0?'开始学习':'继续学习'}：${next.title}
          </button>
        </div>
      </div>
    </div>

    <div class="grid g3" style="margin-top:16px">
      <div class="card"><div class="stat">${learned}</div><div class="stat-label">已学模块</div></div>
      <div class="card"><div class="stat blue">${progress.quizBest}%</div><div class="stat-label">测验最佳正确率</div></div>
      <div class="card"><div class="stat">${progress.quizCount}</div><div class="stat-label">累计答题数</div></div>
    </div>

    <h2>推荐路径</h2>
    <div class="grid g2">
      ${['基础','投资','财务','心理'].map(cat=>{
        const list = COURSES.filter(c=>c.cat===cat);
        const done = list.filter(c=>progress.learned.includes(c.id)).length;
        return `<div class="card">
          <div style="font-size:14px;margin-bottom:4px">${cat}</div>
          <div class="sub">${list.length} 个模块 · 已完成 ${done}</div>
          <div class="bar" style="margin:12px 0 0"><i style="width:${done/list.length*100}%"></i></div>
        </div>`;
      }).join('')}
    </div>`;
}

/* ---------- 课程列表 ---------- */
function viewCourses(){
  const cats = [...new Set(COURSES.map(c=>c.cat))];
  return `
    <h1>知识库</h1>
    <p class="sub">12 个核心模块 · 从货币时间价值到行为金融学</p>
    ${cats.map(cat=>`
      <h2>${cat}</h2>
      <div class="grid g2">
        ${COURSES.filter(c=>c.cat===cat).map(c=>{
          const done = progress.learned.includes(c.id);
          return `<button class="course" data-act="open-course" data-id="${c.id}">
            <span class="tag ${done?'done':''}">${done?'✓ 已学习':cat}</span>
            <h3>${c.title}</h3>
            <p>${c.summary}</p>
            <div class="meta">⏱ 约 ${c.minutes} 分钟 · ${c.quiz.length} 道练习题</div>
          </button>`;
        }).join('')}
      </div>`).join('')}`;
}

/* ---------- 课程详情 ---------- */
function viewCourse(id){
  const c = COURSES.find(x=>x.id===id);
  if(!c) return viewCourses();
  if(!progress.learned.includes(c.id)){
    progress.learned.push(c.id);
    store.set('fl_progress', progress);
  }
  return `
    <button class="back" data-act="back-courses">← 返回知识库</button>
    <span class="tag" style="font-size:11px;color:var(--accent);border:1px solid rgba(52,211,153,.35);padding:2px 9px;border-radius:20px">${c.cat}</span>
    <h1 style="margin:10px 0 6px">${c.title}</h1>
    <p class="sub">${c.summary}</p>

    <div class="card" style="margin-top:20px">
      <div style="font-size:13px;color:var(--accent);margin-bottom:12px;letter-spacing:1px">核心要点</div>
      <ul class="points">${c.points.map(p=>`<li>${p}</li>`).join('')}</ul>
      <div class="article">${c.body.map(p=>`<p>${p}</p>`).join('')}</div>
    </div>

    <div style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn" data-act="start-quiz" data-id="${c.id}">📝 测试本课（${c.quiz.length} 题）</button>
      <button class="btn ghost" data-act="back-courses">继续浏览其他模块</button>
    </div>`;
}

/* ---------- 测验 ---------- */

  const q = state.quiz;
  if(!q){
    return `
      <h1>随堂测验</h1>
      <p class="sub">从全部知识库中随机抽取 10 道题，检验理解程度</p>
      <div class="card" style="margin-top:22px;text-align:center;padding:44px 20px">
        <div style="font-size:40px;margin-bottom:14px">🧠</div>
        <div style="font-size:16px;margin-bottom:8px">准备好了吗？</div>
        <p class="sub" style="margin-bottom:22px">当前最佳正确率：<b style="color:var(--accent)">${progress.quizBest}%</b></p>
        <button class="btn" data-act="start-quiz">开始随机测验</button>
      </div>`;
  }

  if(q.idx >= q.pool.length) return viewQuizResult();

  const cur = q.pool[q.idx];
  const pctDone = Math.round(q.idx / q.pool.length * 100);
  return `
    <div class="quiz-head">
      <div style="font-size:13px;color:var(--muted)">第 ${q.idx+1} / ${q.pool.length} 题 · 来自《${cur.course}》</div>
      <div style="font-size:13px;color:var(--accent)">当前得分 ${q.score}</div>
    </div>
    <div class="bar"><i style="width:${pctDone}%"></i></div>
    <div class="card">
      <div class="q-text">${cur.q}</div>
      ${cur.options.map((o,i)=>{
        let cls = 'opt';
        if(q.answered){
          cls += ' locked';
          if(i===cur.a) cls += ' correct';
          else if(i===q.picked) cls += ' wrong';
        }
        return `<button class="${cls}" data-act="pick" data-i="${i}" ${q.answered?'disabled':''}>
          ${String.fromCharCode(65+i)}. ${o}</button>`;
      }).join('')}
      ${q.answered ? `
        <div class="explain">
          <b>${q.picked===cur.a?'✓ 回答正确':'✗ 回答错误'}</b>　正确答案：${String.fromCharCode(65+cur.a)}<br>
          ${cur.why}
        </div>
        <div style="margin-top:18px">
          <button class="btn" data-act="next">${q.idx+1>=q.pool.length?'查看结果':'下一题 →'}</button>
        </div>` : ''}
    </div>`;
}

function viewQuizResult(){
  const q = state.quiz;
  const total = q.pool.length;
  const rate = Math.round(q.score / total * 100);
  if(rate > progress.quizBest){ progress.quizBest = rate; store.set('fl_progress', progress); }
  const comment = rate>=90 ? '出色！你已经掌握了这些概念的核心。'
    : rate>=70 ? '不错，基础扎实，个别细节可以回看原文。'
    : rate>=50 ? '及格线附近，建议重读相关模块的要点。'
    : '别灰心——回到知识库过一遍，再战一次。';
  return `
    <h1>测验结果</h1>
    <div class="card" style="margin-top:20px;text-align:center;padding:38px 20px">
      <div style="font-size:44px;font-weight:700;color:var(--accent)">${rate}%</div>
      <div class="sub" style="margin-top:8px">答对 ${q.score} / ${total} 题</div>
      <p style="margin-top:16px;color:#c8d5e8;font-size:14px">${comment}</p>
      <div style="margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn" data-act="start-quiz">再来一轮</button>
        <button class="btn ghost" data-act="go" data-view="courses">回知识库复习</button>
      </div>
    </div>`;
}

/* ---------- 计算器 ---------- */
function viewCalc(){
  const tabs = [
    ['compound','复利增长'],
    ['sip','定投终值'],
    ['loan','贷款月供'],
    ['cagr','年化收益率']
  ];
  return `
    <h1>金融计算器</h1>
    <p class="sub">四个最常用的公式，输入即时可得结果</p>
    <div class="tabs" style="margin-top:22px">
      ${tabs.map(([k,label])=>`<button class="tab ${state.calcTab===k?'active':''}" data-act="calc-tab" data-tab="${k}">${label}</button>`).join('')}
    </div>
    <div class="card">${calcBody()}</div>
    <p class="note">所有计算均为理论模型，不含税费与波动，仅供学习理解公式之用，不构成投资建议。</p>`;
}

function calcBody(){
  const t = state.calcTab;
  if(t==='compound') return `
    <div class="fields">
      <div class="field"><label>初始本金（元）</label><input id="c_p" type="number" value="10000"></div>
      <div class="field"><label>年化利率（%）</label><input id="c_r" type="number" value="8" step="0.1"></div>
      <div class="field"><label>投资年限（年）</label><input id="c_t" type="number" value="20"></div>
      <div class="field"><label>每年复利次数</label><input id="c_n" type="number" value="1" min="1"></div>
    </div>
    <button class="btn" data-act="calc-compound">计算</button>
    <div id="c_out" style="margin-top:20px"></div>`;

  if(t==='sip') return `
    <div class="fields">
      <div class="field"><label>每月投入（元）</label><input id="s_p" type="number" value="2000"></div>
      <div class="field"><label>预期年化收益（%）</label><input id="s_r" type="number" value="7" step="0.1"></div>
      <div class="field"><label>投资年限（年）</label><input id="s_t" type="number" value="20"></div>
    </div>
    <button class="btn" data-act="calc-sip">计算</button>
    <div id="c_out" style="margin-top:20px"></div>`;

  if(t==='loan') return `
    <div class="fields">
      <div class="field"><label>贷款金额（元）</label><input id="l_p" type="number" value="1000000"></div>
      <div class="field"><label>年利率（%）</label><input id="l_r" type="number" value="4.2" step="0.01"></div>
      <div class="field"><label>贷款年限（年）</label><input id="l_t" type="number" value="30"></div>
    </div>
    <button class="btn" data-act="calc-loan">计算</button>
    <div id="c_out" style="margin-top:20px"></div>`;

  return `
    <div class="fields">
      <div class="field"><label>期初价值（元）</label><input id="g_a" type="number" value="10000"></div>
      <div class="field"><label>期末价值（元）</label><input id="g_b" type="number" value="50000"></div>
      <div class="field"><label>持有年数（年）</label><input id="g_t" type="number" value="10"></div>
    </div>
    <button class="btn" data-act="calc-cagr">计算</button>
    <div id="c_out" style="margin-top:20px"></div>`;
}

function out(rows){
  const el = document.getElementById('c_out');
  if(!el) return;
  el.innerHTML = `<div class="result">${rows.map(([k,v,blue])=>
    `<div><div class="k">${k}</div><div class="v ${blue?'b':''}">${v}</div></div>`).join('')}</div>`;
}

/* =========================================================
   计算逻辑
   ========================================================= */
const num = id => parseFloat(document.getElementById(id).value) || 0;

const CALC = {
  compound(){
    const p=num('c_p'), r=num('c_r')/100, t=num('c_t'), n=Math.max(1,num('c_n'));
    const fv = p * Math.pow(1 + r/n, n*t);
    out([
      ['最终价值', fmtMoney(fv)],
      ['总收益', fmtMoney(fv - p), true],
      ['收益率', p? pct(fv/p - 1) : '—'],
      ['单利对照', fmtMoney(p*(1+r*t))]
    ]);
  },
  sip(){
    const pmt=num('s_p'), r=num('s_r')/100/12, months=num('s_t')*12;
    const fv = r===0 ? pmt*months : pmt * ((Math.pow(1+r,months)-1)/r);
    const principal = pmt*months;
    out([
      ['最终价值', fmtMoney(fv)],
      ['累计投入', fmtMoney(principal)],
      ['投资收益', fmtMoney(fv-principal), true],
      ['收益占比', principal? pct(fv/principal-1) : '—']
    ]);
  },
  loan(){
    const p=num('l_p'), r=num('l_r')/100/12, n=num('l_t')*12;
    const m = r===0 ? p/n : p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
    const totalPay = m*n;
    out([
      ['每月月供', fmtMoney(m)],
      ['还款总额', fmtMoney(totalPay)],
      ['利息总额', fmtMoney(totalPay-p), true],
      ['利息占比', p? pct((totalPay-p)/p) : '—']
    ]);
  },
  cagr(){
    const a=num('g_a'), b=num('g_b'), t=num('g_t');
    if(a<=0||t<=0){ out([['提示','请输入大于 0 的期初价值与年数']]); return; }
    const cagr = Math.pow(b/a, 1/t) - 1;
    out([
      ['年化收益率 (CAGR)', pct(cagr)],
      ['总收益率', pct(b/a - 1)],
      ['倍数', fmtNum(b/a) + ' 倍', true]
    ]);
  }
};

/* =========================================================
   事件绑定（统一委托）
   ========================================================= */
document.addEventListener('click', e=>{
  // 侧栏导航
  const nav = e.target.closest('.nav-btn');
  if(nav){
    state.view = nav.dataset.view;
    state.courseId = null;
    if(state.view==='quiz' && state.quiz && state.quiz.idx>=state.quiz.pool.length) state.quiz=null;
    render(); return;
  }
  // 视图内动作
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act==='open-course'){
    state.courseId = el.dataset.id; state.view='courses'; render();
  }
  else if(act==='back-courses'){
    state.courseId = null; render();
  }
  else if(act==='go'){
    state.view = el.dataset.view; state.courseId=null; render();
  }
  else if(act==='start-quiz'){
    startQuiz(el.dataset.id || null);
  }
  else if(act==='pick'){
    const q = state.quiz;
    if(q.answered) return;
    q.picked = parseInt(el.dataset.i);
    q.answered = true;
    if(q.picked === q.pool[q.idx].a) q.score++;
    progress.quizCount++;
    store.set('fl_progress', progress);
    render();
  }
  else if(act==='next'){
    state.quiz.idx++;
    state.quiz.answered = false;
    state.quiz.picked = null;
    render();
  }
  else if(act==='calc-tab'){
    state.calcTab = el.dataset.tab;
    $view.innerHTML = viewCalc();
  }
  else if(act.startsWith('calc-')){
    CALC[act.slice(5)]();
  }
});

/* 启动测验 */
function startQuiz(courseId){
  let pool = [];
  COURSES.forEach(c=>{
    if(courseId && c.id!==courseId) return;
    c.quiz.forEach(q => pool.push({...q, course:c.title}));
  });
  pool = shuffle(pool);
  if(!courseId) pool = pool.slice(0,10);
  state.quiz = { pool, idx:0, score:0, answered:false, picked:null };
  state.view = 'quiz';
  render();
}

/* 首次渲染 */
render();
</script>
